[package]
name = "teaql-forge-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
teaql-forge-model = { path = "../teaql-forge-model" }
minijinja.workspace = true
thiserror.workspace = true
miette.workspace = true
heck = "0.5.0"
serde = { workspace = true, features = ["derive"] }
Inflector = "0.11.4"
regex = "1.12.4"
serde_json.workspace = true
roxmltree.workspace = true
zip = "2.1.3"
getrandom = "0.3.4"
flate2 = { version = "1.1", features = ["zlib"] }
crc32fast = "1.5"
encoding_rs = "=0.8.35"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
hyper = { version = "=1.10.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
http-body-util = "=0.1.3"
tokio = { version = "=1.52.3", features = ["rt", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "=0.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[features]
parity-probes = []

[[bin]]
name = "forge-graph"
path = "src/bin/forge-graph.rs"
required-features = ["parity-probes"]

[[bin]]
name = "forge-process-properties"
path = "src/bin/forge-process-properties.rs"
required-features = ["parity-probes"]

[[bin]]
name = "forge-xml-parser"
path = "src/bin/forge-xml-parser.rs"
required-features = ["parity-probes"]
